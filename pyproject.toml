[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rev-rag"
version = "0.1.0"
description = "REV: RAG for Engine & Vehicle Diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.6.0",
    "torch>=2.0.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.23.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.1.0"
]
